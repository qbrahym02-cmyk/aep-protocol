version: "3.9"

services:
  aep-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AEP_ENVIRONMENT=development
      - AEP_PORT=8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/.well-known/aep').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - aep-data:/data

  # Uncomment for PostgreSQL:
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: aep
  #     POSTGRES_USER: aep
  #     POSTGRES_PASSWORD: aep_dev_password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  aep-data:
  # pgdata:
