[package]
name = "aep"
version = "0.4.0"
edition = "2021"
description = "AEP — Agent Execution Protocol. Rust SDK (third independent implementation)"
license = "MIT"

[lib]
name = "aep"
path = "src/lib.rs"

[[bin]]
name = "aep-conformance"
path = "src/bin/conformance.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
